<text x="450" y="135" font-size="16" text-anchor="middle" textLength="422" lengthAdjust="spacingAndGlyphs" fill="#fff" xml:space="preserve">██╔══██║██║▄▄ ██║██║╚██╔╝██║██╔══██║██╔══██╗</text>
