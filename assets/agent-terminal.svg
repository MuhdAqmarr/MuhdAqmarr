<text x="450" y="198" font-size="13" text-anchor="middle" class="dim">fullstack dev  ·  agentic-holic  ·  creative ui/ux  ·  kuala lumpur</text>
<line x1="40" y1="214" x2="860" y2="214" stroke="#21262d" stroke-dasharray="4 4"/>
<text class="l0" x="40" y="238" font-size="14" xml:space="preserve"><tspan fill="#38bdf8" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">aqmar run --agents=all &quot;ship DentalHub&quot;</tspan></text>
<text class="l1" x="40" y="260" font-size="14" xml:space="preserve"><tspan fill="#a78bfa" font-weight="700">[orchestrator]</tspan><tspan fill="#c9d1d9" dx="8">spawning planner, coder, reviewer, tester ...</tspan></text>
<text class="l2" x="40" y="282" font-size="14" xml:space="preserve"><tspan fill="#f472b6" font-weight="700">[planner]</tspan><tspan fill="#c9d1d9" dx="8">OK  split feature into 12 tasks, 3 in parallel</tspan></text>
<text class="l3" x="40" y="304" font-size="14" xml:space="preserve"><tspan fill="#34d399" font-weight="700">[coder]</tspan><tspan fill="#c9d1d9" dx="8">OK  HR + accounting endpoints, patient app screens</tspan></text>
<text class="l4" x="40" y="326" font-size="14" xml:space="preserve"><tspan fill="#fbbf24" font-weight="700">[reviewer]</tspan><tspan fill="#c9d1d9" dx="8">OK  0 blockers, 3 nits, 1 &quot;why is this a god component&quot;</tspan></text>
<text class="l5" x="40" y="348" font-size="14" xml:space="preserve"><tspan fill="#60a5fa" font-weight="700">[tester]</tspan><tspan fill="#c9d1d9" dx="8">OK  148 passed, 0 failed</tspan></text>
<text class="l6" x="40" y="370" font-size="14" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700">[outreach-ai]</tspan><tspan fill="#c9d1d9" dx="8">OK  replied to 37 patients while the human slept</tspan></text>
<text class="l7" x="40" y="392" font-size="14" xml:space="preserve"><tspan fill="#22c55e" font-weight="700">done</tspan><tspan fill="#c9d1d9" dx="8">shipped. coffee: 4 cups | human role: vibes + final say</tspan></text>
<g class="curwrap"><text x="40" y="414" font-size="14" fill="#38bdf8" font-weight="700">$</text><rect class="cursor" x="56" y="402" width="9" height="15" fill="#c9d1d9"/></g>
