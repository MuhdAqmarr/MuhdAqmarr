<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Aqmar agentic terminal" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace;}.dim{fill:#8b949e}@keyframes shimmer{0%{transform:translateX(-450px)}100%{transform:translateX(450px)}}.shine{animation:shimmer 4s linear infinite}@keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(460px)}}.scanbar{animation:scan 6s linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1s step-end infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes glitch{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(-3px,1px)}94%{transform:translate(3px,-1px)}95%{transform:translate(-1px,0)}96%{transform:translate(0,0)}}.glitch{animation:glitch 5s steps(1) infinite}@keyframes l0{0%,5.33%{clip-path:inset(0 100% 0 0);opacity:1}12.67%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l0{animation:l0 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l1{0%,13.67%{clip-path:inset(0 100% 0 0);opacity:1}17.33%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l1{animation:l1 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l2{0%,22.00%{clip-path:inset(0 100% 0 0);opacity:1}25.67%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l2{animation:l2 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l3{0%,30.33%{clip-path:inset(0 100% 0 0);opacity:1}34.00%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l3{animation:l3 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l4{0%,38.67%{clip-path:inset(0 100% 0 0);opacity:1}42.33%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l4{animation:l4 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l5{0%,47.00%{clip-path:inset(0 100% 0 0);opacity:1}50.67%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l5{animation:l5 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l6{0%,55.33%{clip-path:inset(0 100% 0 0);opacity:1}59.00%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l6{animation:l6 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes l7{0%,63.67%{clip-path:inset(0 100% 0 0);opacity:1}67.33%{clip-path:inset(0 0 0 0);opacity:1}92.0%{clip-path:inset(0 0 0 0);opacity:1}96.0%,100%{clip-path:inset(0 0 0 0);opacity:0}}.l7{animation:l7 15.0s linear infinite;clip-path:inset(0 100% 0 0)}@keyframes cur{0%,72.00%{visibility:hidden}72.10%,92%{visibility:visible}96%,100%{visibility:hidden}}.curwrap{animation:cur 15.0s linear infinite}</style>
<defs>
