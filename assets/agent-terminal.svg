<rect width="900" height="440" fill="#0d1117"/>
<rect width="900" height="34" fill="#161b22"/><line x1="0" y1="34" x2="900" y2="34" stroke="#30363d"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
